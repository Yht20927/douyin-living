[project]
name = "douyin-live-recorder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core (recording)
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "websockets>=12.0",
    "websocket-client>=1.6",
    "protobuf>=5.0",
    "httpx>=0.27",
    "PyExecJS>=1.5",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    # Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # Math
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
ai = [
    # ASR
    "faster-whisper>=1.0",
    "librosa>=0.10",
    # NLP
    "jieba>=0.42",
    "transformers>=4.30",
    "fasttext>=0.9",
    "text2vec>=1.0",
    "scikit-learn>=1.3",
    # Vision
    "scenedetect[opencv]>=0.6",
    "opencv-python>=4.8",
    # Audio events
    "panns-inference>=0.1",
    # Diarization (optional, heavy)
    "whisperx>=3.1",
    "torch>=2.0",
    # Face detection (optional)
    "insightface>=0.7",
]

[project.scripts]
douyin-live = "src.controller:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src"]
omit = ["src/protobuf/Live_pb2.py"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
