sensitivity_default: 2.5
min_duration_default: 15.0
max_duration_default: 90.0
resolution_default: "720p"
ws_join_timeout: 3.0
writer_join_timeout: 3.0
queue_timeout: 0.5
signal_pool_workers: 3
ffmpeg_timeout_clip: 300
ffmpeg_timeout_thumbnail: 60
ffmpeg_timeout_burn: 300
asr_model: "base"
asr_device: "auto"
asr_compute_type: "int8"
asr_diarize: true

# Two-stage recall/rerank (Sprint 5). Keep disabled until the annotated-set
# evaluation confirms it beats the legacy point-scoring path.
two_stage_enabled: false
two_stage_recall_per_hour: 60.0
two_stage_top_k: 20
two_stage_min_gap_sec: 12.0
two_stage_recall_threshold: 0.8
two_stage_window_sec: 30.0
two_stage_min_score: 0.0
two_stage_dynamic_duration: true
two_stage_boundary_search_sec: 8.0
two_stage_platform: "none"
