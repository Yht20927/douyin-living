# Profile weights are validated at load time:
#   - keys must exist in src.util.FEATURE_NAMES
#   - weights must be non-negative
#   - each profile must sum to 1.0 ± weight_sum_tolerance
# normalize_profiles=true rescales YAML values to 1.0 automatically.
normalize_profiles: true
weight_sum_tolerance: 0.01

profiles:
  default:
    dmDensity: 0.15
    dmAcceleration: 0.05
    dmEntropy: 0.05
    dmSentiment: 0.10
    dmUtr: 0.03
    asrKeyword: 0.10
    topicChange: 0.05
    speakerChange: 0.05
    rms: 0.10
    mfccDist: 0.02
    eventLaughter: 0.10
    eventApplause: 0.05
    eventMusic: 0.05
    sceneChange: 0.05
    motion: 0.05
    faceCount: 0.00

  game:
    dmDensity: 0.19
    dmAcceleration: 0.09
    dmEntropy: 0.05
    dmSentiment: 0.05
    dmUtr: 0.03
    asrKeyword: 0.07
    topicChange: 0.05
    speakerChange: 0.03
    rms: 0.07
    mfccDist: 0.02
    eventLaughter: 0.09
    eventApplause: 0.09
    eventMusic: 0.03
    sceneChange: 0.05
    motion: 0.09
    faceCount: 0.00

  shopping:
    dmDensity: 0.12
    dmAcceleration: 0.04
    dmEntropy: 0.04
    dmSentiment: 0.06
    dmUtr: 0.04
    asrKeyword: 0.22
    topicChange: 0.06
    speakerChange: 0.06
    rms: 0.06
    mfccDist: 0.02
    eventLaughter: 0.06
    eventApplause: 0.06
    eventMusic: 0.06
    sceneChange: 0.06
    motion: 0.04
    faceCount: 0.00

  talent:
    dmDensity: 0.10
    dmAcceleration: 0.05
    dmEntropy: 0.03
    dmSentiment: 0.14
    dmUtr: 0.03
    asrKeyword: 0.10
    topicChange: 0.05
    speakerChange: 0.10
    rms: 0.17
    mfccDist: 0.02
    eventLaughter: 0.05
    eventApplause: 0.05
    eventMusic: 0.05
    sceneChange: 0.03
    motion: 0.03
    faceCount: 0.00

preprocessing:
  ewma_alpha: 0.3
  zscore_window_sec: 60
  zscore_eps: 1.0e-10
  median_filter_size: 5

detection:
  windows: [3, 10, 30]
  nms_merge_distance: 15.0
  min_clip_duration: 15.0
  max_clip_duration: 90.0
  sensitivity_default: 2.5
  peak_persistence_frames: 3
  candidate_gap_sec: 3.0
  trigger_zscore_threshold: 2.0
  window_factor: 2

boundary:
  pad_sec: 5
  valley_search_range: 10
  valley_window_radius: 5

t_test:
  pre_window_sec: 5
  pvalue_threshold: 0.05

global_decay:
  coeff: 0.1

thumbnail:
  offset_sec: 3.0

breakdown:
  top_n: 5

lag_compensation:
  min_len: 10
  max_shift: 5

boost:
  tanh_divisor: 2.0
